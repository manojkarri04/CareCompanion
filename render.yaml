services:
  # 1. Django Core Microservice
  - type: web
    name: carecompanion-django-core
    env: python
    rootDir: backend/services/django_core
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && gunicorn core_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8

  # 2. FastAPI Chatbot & AI Microservice
  - type: web
    name: carecompanion-fastapi-chatbot
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r services/fastapi_chatbot/requirements.txt
    startCommand: uvicorn services.fastapi_chatbot.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.8
